version: '3.8'

services:
  profi-planner:
    build: .
    container_name: profi-planner-server
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      JWT_SECRET: your-secret-key-change-this-in-production
      DATABASE_PATH: /app/data/profi-planner.db
      LOG_DIR: /app/logs
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
